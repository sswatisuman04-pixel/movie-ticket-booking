spring:
  datasource:
    url: jdbc:h2:mem:moviedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  booking:
    hold-duration-minutes: 5
  jwt:
    secret: movie-booking-secret-key-for-jwt-token-generation-min-256-bits-long
    expiration-ms: 86400000
