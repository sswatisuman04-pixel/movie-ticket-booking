spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  booking:
    hold-duration-minutes: 1
    hold-cleanup-interval-ms: 60000
  jwt:
    secret: test-secret-key-for-jwt-token-generation-must-be-256-bits-long-enough
    expiration-ms: 3600000
